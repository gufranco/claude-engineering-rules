name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: pip install -r requirements-dev.txt

      # The runner image ships shellcheck. Installing it unconditionally cost a
      # full apt index refresh on every run and was the step that hung.
      - name: ShellCheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          shellcheck --severity=warning --shell=bash --enable=all tests/test-hooks.sh

      - name: Python lint (ruff check)
        run: ruff check hooks scripts .github/scripts tests

      - name: Python format check (ruff format)
        run: ruff format --check hooks scripts .github/scripts tests

      - name: Validate counts
        run: python3 .github/scripts/validate-counts.py

      - name: Validate markdown link discipline
        run: python3 .github/scripts/validate-markdown-links.py

      - name: Validate JSON
        run: python3 -c "import json, glob; [json.load(open(f)) for f in glob.glob('**/*.json', recursive=True) if 'node_modules' not in f]"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Markdownlint
        run: |
          npx --yes markdownlint-cli2 "rules/*.md" "standards/*.md" "skills/*/SKILL.md" "checklists/*.md" "CLAUDE.md" "README.md" "CONTRIBUTING.md" "SECURITY.md" "CODE_OF_CONDUCT.md"

      - name: Validate YAML
        run: python3 -c "import yaml; yaml.safe_load(open('rules/index.yml'))"

      - name: Validate index.yml paths
        run: |
          python3 -c "
          import os, sys, yaml
          with open('rules/index.yml') as f:
              idx = yaml.safe_load(f)
          errors = 0
          for section in ['always_loaded', 'on_demand']:
              for name, entry in (idx.get(section) or {}).items():
                  path = entry.get('path', f'rules/{name}.md')
                  if not os.path.exists(path):
                      print(f'ERROR: {path} referenced in index.yml does not exist')
                      errors += 1
          if errors:
              sys.exit(1)
          print('All index.yml paths valid')
          "

      - name: Validate Markdown structure
        run: |
          errors=0
          for f in rules/*.md skills/*/SKILL.md checklists/*.md; do
            # Check for unclosed code blocks (odd number of triple backticks)
            count=$(grep -c '^[[:space:]]*```' "$f" 2>/dev/null || true)
            count=${count:-0}
            if [ $((count % 2)) -ne 0 ]; then
              echo "ERROR: $f has unclosed code block ($count triple-backtick lines)"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors file(s) with markdown issues"
            exit 1
          fi
          echo "All markdown files valid"

      - name: Validate agent definitions
        run: python3 .github/scripts/validate-agents.py

      - name: Validate settings.json
        run: python3 .github/scripts/validate-settings.py

      - name: Validate command blocker patterns
        run: python3 .github/scripts/validate-patterns.py

      - name: Validate skill definitions
        run: python3 .github/scripts/validate-skills.py

      - name: Validate cross-references
        run: python3 .github/scripts/validate-cross-refs.py

  workflow-lint:
    name: Workflow lint (actionlint + yamllint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install yamllint
        run: pip install -r requirements-dev.txt

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          pwd >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: yamllint
        run: |
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: {check-keys: false}}}' .github/

      # Catches what actionlint does not: template injection into run blocks,
      # over-broad token permissions, unpinned action refs, credential
      # persistence into artifacts, and artifact poisoning via workflow_run.
      #
      # The gate is set at low because the workflows currently pass at low.
      # Setting it where the tree already sits is what makes the next
      # regression visible; a threshold above the current state gates nothing.
      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --persona=regular --min-severity=low .github/workflows/

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install mypy
        run: pip install -r requirements-dev.txt

      # Calls the Makefile so the strict-typed file list lives in exactly one
      # place. Repeating it here is how it silently drifted before.
      - name: mypy --strict
        run: make typecheck

  hooks:
    name: Hook tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Make hooks executable
        run: chmod +x hooks/*.py tests/test-hooks.sh

      - name: Run hook smoke tests
        run: bash tests/test-hooks.sh

      - name: Hook performance check
        run: bash .github/scripts/hook-benchmark.sh --threshold 500

  pytest:
    name: Python unit + integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Installed from a pinned commit rather than apt. Refreshing the apt
      # index pulled a multi-minute stall into the critical path and twice hung
      # until the job timed out. This clone is deterministic and takes about a
      # second.
      - name: Install bats-core
        env:
          BATS_REF: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          git clone --quiet --no-checkout https://github.com/bats-core/bats-core.git "$workdir"
          git -C "$workdir" fetch --quiet --depth 1 origin "$BATS_REF"
          git -C "$workdir" checkout --quiet FETCH_HEAD
          sudo "$workdir/install.sh" /usr/local
          bats --version

      - name: Symlink checkout to ~/.claude
        run: |
          mkdir -p "$HOME"
          if [ ! -e "$HOME/.claude" ]; then
            ln -s "$GITHUB_WORKSPACE" "$HOME/.claude"
          fi

      - name: Bootstrap venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: make test-cov
        run: make test-cov

      - name: make test-bats
        run: make test-bats

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  release-config:
    name: Release config dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # semantic-release verifies push access with `git push --dry-run` before
      # it analyzes anything, so a read-only token fails the run before it can
      # reach the plugin chain that this job exists to check.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install release toolchain
        run: npm ci --ignore-scripts

      # The toolchain never ships to a user, but it runs with a write token on
      # main, so a vulnerable dependency there is a release-pipeline risk.
      - name: Audit release toolchain
        run: npm audit --audit-level=high

      # Renders release notes directly through the configured plugin, with no
      # token and no git access, so it also runs on Dependabot and fork pull
      # requests where the dry run below cannot. This is the check that catches
      # a preset bumped past the changelog writer semantic-release pins, which
      # produces notes missing every commit rather than raising an error.
      - name: Release notes render
        run: node scripts/verify-release-notes.mjs

      # The full dry run additionally proves the whole plugin chain resolves.
      # Restricted to push events because a pull request from a fork, and every
      # Dependabot pull request, gets a read-only token regardless of the
      # permissions block, and semantic-release verifies push access before it
      # analyzes anything. Releases only ever run from main, so a push-event
      # check still gates every release.
      - name: semantic-release dry run
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run --no-ci

      - name: Plugin version sync is idempotent
        run: |
          set -euo pipefail
          node scripts/sync-plugin-versions.mjs 9.9.9
          first="$(git diff --stat)"
          node scripts/sync-plugin-versions.mjs 9.9.9
          second="$(git diff --stat)"
          test "$first" = "$second"
          git checkout -- .claude-plugin plugins
          test -z "$(git status --porcelain)"

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          category: codeql-python

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
