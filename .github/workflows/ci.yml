name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked toolchain
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Python lint (ruff check)
        run: make lint-py

      - name: Python format check (ruff format)
        run: make format-check

      - name: Validate counts
        run: python3 .github/scripts/validate-counts.py

      - name: Validate markdown link discipline
        run: python3 .github/scripts/validate-markdown-links.py

      - name: Validate JSON
        run: python3 -c "import json, glob; [json.load(open(f)) for f in glob.glob('**/*.json', recursive=True) if 'node_modules' not in f]"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install pinned Node tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Markdownlint
        run: make lint-md

      - name: Validate YAML
        run: python3 -c "import yaml; yaml.safe_load(open('rules/index.yml'))"

      - name: Validate index.yml paths
        run: |
          python3 -c "
          import os, sys, yaml
          with open('rules/index.yml') as f:
              idx = yaml.safe_load(f)
          errors = 0
          for section in ['always_loaded', 'on_demand']:
              for name, entry in (idx.get(section) or {}).items():
                  path = entry.get('path', f'rules/{name}.md')
                  if not os.path.exists(path):
                      print(f'ERROR: {path} referenced in index.yml does not exist')
                      errors += 1
          if errors:
              sys.exit(1)
          print('All index.yml paths valid')
          "

      - name: Validate Markdown structure
        run: |
          errors=0
          for f in rules/*.md skills/*/SKILL.md checklists/*.md; do
            # Check for unclosed code blocks (odd number of triple backticks)
            count=$(grep -c '^[[:space:]]*```' "$f" 2>/dev/null || true)
            count=${count:-0}
            if [ $((count % 2)) -ne 0 ]; then
              echo "ERROR: $f has unclosed code block ($count triple-backtick lines)"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors file(s) with markdown issues"
            exit 1
          fi
          echo "All markdown files valid"

      - name: Validate agent definitions
        run: python3 .github/scripts/validate-agents.py

      - name: Validate settings.json
        run: python3 .github/scripts/validate-settings.py

      - name: Validate command blocker patterns
        run: python3 .github/scripts/validate-patterns.py

      - name: Validate skill definitions
        run: python3 .github/scripts/validate-skills.py

      - name: Lint skill structure
        run: python3 tools/lint-skills.py --strict

      - name: Validate cross-references
        run: python3 .github/scripts/validate-cross-refs.py

      - name: Validate registry drift
        run: python3 .github/scripts/validate-registry-drift.py

      - name: Validate instruction budget
        run: python3 .github/scripts/validate-instruction-budget.py

      - name: Validate normative keywords
        run: python3 .github/scripts/validate-normative-keywords.py

      - name: Validate checklist counts
        run: python3 .github/scripts/validate-checklist-counts.py

  workflow-lint:
    name: Workflow lint (actionlint + yamllint)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked toolchain
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: actionlint
        run: actionlint -color

      - name: yamllint
        run: |
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: {check-keys: false}}}' .github/

      # Catches what actionlint does not: template injection into run blocks,
      # over-broad token permissions, unpinned action refs, credential
      # persistence into artifacts, and artifact poisoning via workflow_run.
      #
      # The gate is set at low because the workflows currently pass at low.
      # Setting it where the tree already sits is what makes the next
      # regression visible; a threshold above the current state gates nothing.
      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --persona=regular --min-severity=low .github/workflows/

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked toolchain
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Calls the Makefile so the strict-typed file list lives in exactly one
      # place. Repeating it here is how it silently drifted before.
      - name: mypy --strict
        run: make typecheck

  hooks:
    name: Hook tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked toolchain
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run hook smoke tests
        run: make test-smoke

      - name: Hook performance check
        run: make benchmark

  pytest:
    name: Python unit + integration
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked toolchain
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Symlink checkout to ~/.claude
        run: |
          mkdir -p "$HOME"
          if [ ! -e "$HOME/.claude" ]; then
            ln -s "$GITHUB_WORKSPACE" "$HOME/.claude"
          fi

      - name: make test-cov
        run: make test-cov

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  release-config:
    name: Release config dry-run
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # semantic-release verifies push access with `git push --dry-run` before
      # it analyzes anything, so a read-only token fails the run before it can
      # reach the plugin chain that this job exists to check.
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install release toolchain
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The toolchain never ships to a user, but it runs with a write token on
      # main, so a vulnerable dependency there is a release-pipeline risk.
      - name: Audit release toolchain
        run: |
          pnpm audit --json > "$RUNNER_TEMP/audit.json" || true
          python3 .github/scripts/audit-release-toolchain.py < "$RUNNER_TEMP/audit.json"

      - name: Verify registry signatures
        run: pnpm audit signatures

      # Renders release notes directly through the configured plugin, with no
      # token and no git access, so it also runs on Dependabot and fork pull
      # requests where the dry run below cannot. This is the check that catches
      # a preset bumped past the changelog writer semantic-release pins, which
      # produces notes missing every commit rather than raising an error.
      - name: Release notes render
        run: node scripts/verify-release-notes.mjs

      - name: Node script tests at full coverage
        run: make test-js

      # The full dry run additionally proves the whole plugin chain resolves.
      # Restricted to push events because a pull request from a fork, and every
      # Dependabot pull request, gets a read-only token regardless of the
      # permissions block, and semantic-release verifies push access before it
      # analyzes anything. Releases only ever run from main, so a push-event
      # check still gates every release.
      - name: semantic-release dry run
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run --no-ci

      - name: Plugin version sync is idempotent
        run: |
          set -euo pipefail
          node scripts/sync-plugin-versions.mjs 9.9.9
          first="$(git diff --stat)"
          node scripts/sync-plugin-versions.mjs 9.9.9
          second="$(git diff --stat)"
          test "$first" = "$second"
          git checkout -- .claude-plugin plugins
          test -z "$(git status --porcelain)"

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-python

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
