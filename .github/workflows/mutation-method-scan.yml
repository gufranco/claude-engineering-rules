name: Mutation method scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Mutation scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Make hook executable
        run: chmod +x hooks/mutation-method-blocker.py

      - name: Collect changed JS/TS files
        id: collect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=AM "origin/$BASE_REF"...HEAD > candidates.txt
          else
            git ls-files > candidates.txt
          fi
          grep -E '\.(ts|tsx|js|jsx|mjs|cjs|mts|cts)$' candidates.txt \
            | { grep -v '^tests/corpus/' || [ "$?" -eq 1 ]; } \
            > scan-targets.txt || [ "$?" -eq 1 ]
          count=$(wc -l < scan-targets.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Will scan $count file(s)"

      - name: Run mutation-method-blocker
        if: steps.collect.outputs.count != '0'
        env:
          MUTATION_METHOD_BATCH_MODE: "1"
        shell: bash
        run: python3 hooks/mutation-method-blocker.py < scan-targets.txt
