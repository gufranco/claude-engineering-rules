name: Mutation method scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Mutation scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked toolchain
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Make hook executable
        run: chmod +x hooks/mutation-method-blocker.py

      - name: Collect changed JS/TS files
        id: collect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=AM "origin/$BASE_REF"...HEAD > candidates.txt
          else
            git ls-files > candidates.txt
          fi
          grep -E '\.(ts|tsx|js|jsx|mjs|cjs|mts|cts)$' candidates.txt \
            | { grep -v '^tests/corpus/' || [ "$?" -eq 1 ]; } \
            > scan-targets.txt || [ "$?" -eq 1 ]
          count=$(wc -l < scan-targets.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Will scan $count file(s)"

      - name: Run mutation-method-blocker
        if: steps.collect.outputs.count != '0'
        env:
          MUTATION_METHOD_BATCH_MODE: "1"
        shell: bash
        run: python3 hooks/mutation-method-blocker.py < scan-targets.txt
