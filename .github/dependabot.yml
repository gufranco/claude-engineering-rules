version: 2

updates:
  # GitHub Actions are pinned to commit SHAs for supply-chain integrity, which
  # means nothing updates them without a bot. Dependabot rewrites the SHA and
  # the trailing version comment together, so the pin stays readable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      # One pull request for the routine bumps. A major bump leaves the group
      # so it gets reviewed on its own, since that is where a breaking change
      # to a workflow input shows up.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - python
    groups:
      # The test runner plugins move together and break together. Bumping
      # pytest without its plugins produces a plugin-incompatibility failure
      # that reads like a test regression.
      pytest-stack:
        patterns:
          - pytest
          - pytest-*
          - coverage
        update-types:
          - minor
          - patch
      lint-stack:
        patterns:
          - ruff
          - mypy
          - yamllint
          - PyYAML
          - types-PyYAML
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - javascript
    groups:
      release-tooling:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-conventionalcommits"
        update-types:
          - minor
          - patch
