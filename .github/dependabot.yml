version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      # One pull request for the routine bumps. A major bump leaves the group
      # so it gets reviewed on its own, since that is where a breaking change
      # to a workflow input shows up.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - javascript
    ignore:
      # The conventionalcommits preset v10 requires conventional-changelog-writer
      # v9, and @semantic-release/release-notes-generator still pins ^8.0.0. The
      # mismatch does not error: it renders release notes with every commit
      # missing. Lift this once release-notes-generator accepts writer v9.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
    groups:
      release-tooling:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
          - "conventional-changelog-conventionalcommits"
        update-types:
          - minor
          - patch
