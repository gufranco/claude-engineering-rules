name: Proposal
description: Propose a new rule, standard, skill, hook, or agent, or a change to one.
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Rule (always loaded)
        - Standard (loaded on demand)
        - Skill or slash command
        - Hook
        - Agent
        - Tooling or CI
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        What goes wrong or is missing today. A concrete case helps most: the
        prompt you gave, what Claude did, and what you needed instead.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >-
        What you want added or changed, and how it would behave once it
        exists. For a hook, name what it would block; for a skill, what you
        would type and what it would do.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: >-
        Optional. Links to other projects, skills, or articles that already do
        this, so the idea can be compared against a working example.
    validations:
      required: false

  - type: textarea
    id: false-positives
    attributes:
      label: Hook false positives
      description: >-
        Optional, for hooks only. Legitimate code or commands the hook could
        wrongly block.
    validations:
      required: false
