name: Bug report
description: A hook, rule, skill, or script behaves differently than documented.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. Use
        [a private security advisory](https://github.com/gufranco/claude-engineering-rules/security/advisories/new)
        instead, per [SECURITY.md](../blob/main/SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part misbehaves?
      options:
        - Hook
        - Rule or standard
        - Skill or slash command
        - Agent
        - Validation script or CI
        - settings.json
        - Documentation
        - Something else
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      description: The exact file, if you know it.
      placeholder: hooks/mutation-method-blocker.py
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: >-
        The exact steps. A prompt, a command, or a file that triggers it.
        Paste the input rather than describing it.
      placeholder: |
        1. Write a file containing `const a = [1]; a.push(2);`
        2. The hook blocks the write
        3. The file is in a directory listed as a hot path
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: >-
        Paste the output verbatim, including the block message and any error
        codes. Do not paraphrase.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, or commit SHA if running from main.
      placeholder: v1.2.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, shell, Python version, Claude Code version.
      placeholder: |
        macOS 15.3, zsh, Python 3.12.8, Claude Code 2.x
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I confirmed this is not a documented bypass or a deliberate limitation.
          required: true
