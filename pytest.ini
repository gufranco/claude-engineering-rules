[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    -ra
    --tb=short
    --cov=hooks
    --cov=.github/scripts
    --cov=scripts
    --cov=tools
    --cov=skills
    --cov-config=.coveragerc
    --cov-fail-under=100
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html

markers =
    unit: pure-function tests with no I/O
    integration: tests that exercise real services (db, redis, network)
    slow: tests that take more than 5 seconds
    smoke: critical-path post-deploy verification
    perf: latency / throughput regression checks

filterwarnings =
    error
    ignore::DeprecationWarning:coverage.*
    ignore::PendingDeprecationWarning
    ignore::coverage.exceptions.CoverageWarning

xfail_strict = true
